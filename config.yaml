# PortPerfilCrypto experiment configuration

# Analysis period in YYYY-MM-DD format.
start_date: '2022-01-01'
end_date: '2025-12-31'

# Rolling estimation window and Monday-to-Sunday rebalance periods.
estimation_window_months: 12
rebalance_frequency: 'W-MON'

# Union of historical NCI constituents from 2022 to 2025. This list controls
# data collection only; paths.constituent_history controls daily eligibility.
assets:
  - BTC
  - ETH
  - LTC
  - LINK
  - DOT
  - UNI
  - XLM
  - BCH
  - ETC
  - FIL
  - AXS
  - SAND
  - ARB
  - SOL
  - XRP
  - ADA
  - AVAX
  - MATIC

# Experimental annualized volatility ceilings. Profile names are relative to
# this study, not universal investor suitability categories.
profiles:
  risk_065:
    target_volatility: 0.65
    name: 'Conservative (65%)'
  risk_085:
    target_volatility: 0.85
    name: 'Moderate (85%)'
  risk_105:
    target_volatility: 1.05
    name: 'Aggressive (105%)'

optimization:
  min_weight: 0.0            # Long-only portfolios.
  max_weight: 1.0            # No additional concentration cap.
  min_observations: 300      # Required observations in each estimation window.
  max_data_gap_days: 7       # Maximum age of the most recent observation.
  max_internal_gap_days: 7   # Maximum forward-filled internal gap.

backtest:
  initial_capital: 10000.0
  transaction_cost: 0.001    # 0.1% times turnover.
  # Missing prices require a documented correction before final publication.
  stale_positions_are_errors: true

# Weekly comparisons are primary; monthly comparisons test robustness.
statistics:
  primary_return_frequency: 'W-SUN'
  robustness_return_frequency: 'ME'

paths:
  # PORTPERFILCRYPTO_CACHE_DIR overrides this location.
  cache_dir: '~/.cache/portperfilcrypto'
  processed_data: '~/PortPerfilCrypto/data/processed'
  constituent_history: 'nci_constituents.yaml'
  results: '~/PortPerfilCrypto/results'
  reports: '~/PortPerfilCrypto/reports'
